<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">HealthyCraftyBites ER Diagram</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="80" y="110" width="220" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="190" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">Users</text>
    <line x1="80" y1="160" x2="300" y2="160" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="190" font-size="14" fill="#334155">• user_id (PK)</text>
    <text x="100" y="214" font-size="14" fill="#334155">• full_name</text>
    <text x="100" y="238" font-size="14" fill="#334155">• email (UK)</text>
    <text x="100" y="262" font-size="14" fill="#334155">• role</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="360" y="110" width="220" height="170" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="470" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">Categories</text>
    <line x1="360" y1="160" x2="580" y2="160" stroke="#94a3b8" stroke-width="1"/>
    <text x="380" y="190" font-size="14" fill="#334155">• category_id (PK)</text>
    <text x="380" y="214" font-size="14" fill="#334155">• name (UK)</text>
    <text x="380" y="238" font-size="14" fill="#334155">• description</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="640" y="110" width="260" height="190" rx="12" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/>
    <text x="770" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">Ingredients</text>
    <line x1="640" y1="160" x2="900" y2="160" stroke="#94a3b8" stroke-width="1"/>
    <text x="660" y="190" font-size="14" fill="#334155">• ingredient_id (PK)</text>
    <text x="660" y="214" font-size="14" fill="#334155">• category_id (FK)</text>
    <text x="660" y="238" font-size="14" fill="#334155">• name</text>
    <text x="660" y="262" font-size="14" fill="#334155">• calories / protein / carbs / fat</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="940" y="110" width="240" height="190" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1060" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#7c3aed">Menu Items</text>
    <line x1="940" y1="160" x2="1180" y2="160" stroke="#94a3b8" stroke-width="1"/>
    <text x="960" y="190" font-size="14" fill="#334155">• menu_item_id (PK)</text>
    <text x="960" y="214" font-size="14" fill="#334155">• category_id (FK)</text>
    <text x="960" y="238" font-size="14" fill="#334155">• name</text>
    <text x="960" y="262" font-size="14" fill="#334155">• price</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="300" y="360" width="220" height="180" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="410" y="395" text-anchor="middle" font-size="20" font-weight="700" fill="#be185d">Meals</text>
    <line x1="300" y1="410" x2="520" y2="410" stroke="#94a3b8" stroke-width="1"/>
    <text x="320" y="440" font-size="14" fill="#334155">• meal_id (PK)</text>
    <text x="320" y="464" font-size="14" fill="#334155">• user_id (FK)</text>
    <text x="320" y="488" font-size="14" fill="#334155">• total_calories / protein / carbs / fat</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="610" y="360" width="240" height="180" rx="12" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
    <text x="730" y="395" text-anchor="middle" font-size="20" font-weight="700" fill="#4d7c0f">Orders</text>
    <line x1="610" y1="410" x2="850" y2="410" stroke="#94a3b8" stroke-width="1"/>
    <text x="630" y="440" font-size="14" fill="#334155">• order_id (PK)</text>
    <text x="630" y="464" font-size="14" fill="#334155">• user_id (FK)</text>
    <text x="630" y="488" font-size="14" fill="#334155">• status</text>
    <text x="630" y="512" font-size="14" fill="#334155">• total_amount / total_calories</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="930" y="360" width="250" height="180" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="1055" y="395" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">Order Items</text>
    <line x1="930" y1="410" x2="1180" y2="410" stroke="#94a3b8" stroke-width="1"/>
    <text x="950" y="440" font-size="14" fill="#334155">• order_item_id (PK)</text>
    <text x="950" y="464" font-size="14" fill="#334155">• order_id (FK)</text>
    <text x="950" y="488" font-size="14" fill="#334155">• meal_id / menu_item_id (FK)</text>
    <text x="950" y="512" font-size="14" fill="#334155">• quantity / subtotal</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="330" y="650" width="240" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="685" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d">Meal Ingredients</text>
    <line x1="330" y1="700" x2="570" y2="700" stroke="#94a3b8" stroke-width="1"/>
    <text x="350" y="730" font-size="14" fill="#334155">• meal_id (FK)</text>
    <text x="350" y="754" font-size="14" fill="#334155">• ingredient_id (FK)</text>
    <text x="350" y="778" font-size="14" fill="#334155">• quantity</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="760" y="650" width="260" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="890" y="685" text-anchor="middle" font-size="20" font-weight="700" fill="#c2410c">Menu Item Ingredients</text>
    <line x1="760" y1="700" x2="1020" y2="700" stroke="#94a3b8" stroke-width="1"/>
    <text x="780" y="730" font-size="14" fill="#334155">• menu_item_id (FK)</text>
    <text x="780" y="754" font-size="14" fill="#334155">• ingredient_id (FK)</text>
    <text x="780" y="778" font-size="14" fill="#334155">• quantity</text>
  </g>

  <g stroke="#64748b" stroke-width="2.2" fill="none">
    <line x1="300" y1="195" x2="360" y2="195"/>
    <line x1="580" y1="195" x2="640" y2="195"/>
    <line x1="900" y1="195" x2="940" y2="195"/>

    <line x1="190" y1="280" x2="300" y2="360"/>
    <line x1="410" y1="540" x2="610" y2="360"/>
    <line x1="770" y1="300" x2="930" y2="360"/>

    <line x1="570" y1="730" x2="760" y2="730"/>
    <line x1="450" y1="540" x2="450" y2="650"/>
    <line x1="890" y1="540" x2="890" y2="650"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">
    <text x="320" y="185" >1</text>
    <text x="340" y="185" >many</text>
    <text x="600" y="185" >1</text>
    <text x="620" y="185" >many</text>
    <text x="920" y="185" >1</text>
    <text x="940" y="185" >many</text>

    <text x="230" y="330" >Users → Meals</text>
    <text x="500" y="330" >Meals → Orders</text>
    <text x="840" y="330" >Menu Items → Order Items</text>

    <text x="620" y="725" >Meal Ingredients</text>
    <text x="780" y="725" >Menu Item Ingredients</text>
  </g>
</svg>